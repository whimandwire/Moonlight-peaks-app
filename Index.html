<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nocturne — a Moonlight Peaks almanac</title>
<style>
:root{
  --ink:#151021;
  --deep:#1d1730;
  --panel:#241d3b;
  --edge:#3a3055;
  --moon:#ece7fa;
  --fog:#a294c4;
  --blood:#cf4a63;
  --verdant:#78c497;
  --candle:#e3b95c;
  --iris:#8f7ae0;
  --r:14px;
  --tabh:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, #2c2348 0%, transparent 60%),
    var(--ink);
  color:var(--moon);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
h1,h2,h3,.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--iris)}

/* ---------- date bar ---------- */
.datebar{
  position:sticky;top:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:linear-gradient(180deg,rgba(21,16,33,.98),rgba(21,16,33,.86));
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--edge);
  display:flex;align-items:center;gap:12px;
}
.moondial{
  width:44px;height:44px;border-radius:50%;flex:0 0 44px;
  background:conic-gradient(var(--candle) var(--fill,0deg), #322a4d 0);
  display:grid;place-items:center;position:relative;
}
.moondial i{
  position:absolute;inset:5px;border-radius:50%;background:var(--deep);
  display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:700;
}
.dateinfo{flex:1;min-width:0}
.dateinfo b{display:block;font-size:17px;font-family:"Iowan Old Style",Georgia,serif}
.dateinfo span{display:block;font-size:12.5px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nightbtn{
  border:1px solid var(--edge);border-radius:999px;padding:9px 14px;
  font-size:13px;font-weight:600;background:var(--panel);white-space:nowrap;
}
.nightbtn:active{background:var(--edge)}

#nosave{
  display:none;flex-direction:column;gap:7px;margin:0;padding:13px 16px;
  background:rgba(207,74,99,.12);border-bottom:1px solid rgba(207,74,99,.4);font-size:13px;
}
#nosave b{color:var(--blood);font-size:13.5px}
#nosave span{color:var(--fog);line-height:1.45}
#nosave button{align-self:flex-start;border:1px solid var(--edge);border-radius:9px;padding:8px 13px;font-size:12.5px;background:var(--panel)}

/* ---------- layout ---------- */
main{padding:14px 14px 28px;max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}
section{margin-bottom:18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 9px}
.sechead h2{font-size:19px;margin:0}
.sechead .meta{font-size:12.5px;color:var(--fog)}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}

/* ---------- tonight hero ---------- */
.hero{
  background:linear-gradient(160deg,#2b2249,#1d1730 70%);
  border:1px solid var(--edge);border-radius:20px;padding:18px 16px;position:relative;overflow:hidden;
}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(227,185,92,.22),transparent 62%)}
.hero h1{margin:0;font-size:26px;line-height:1.15}
.hero .sub{color:var(--fog);font-size:13.5px;margin-top:4px}
.loadbar{height:9px;border-radius:99px;background:#322a4d;margin-top:14px;overflow:hidden;display:flex}
.loadbar i{display:block;height:100%}
.loadnote{font-size:12.5px;margin-top:7px;color:var(--fog)}
.loadnote.warn{color:var(--candle)}
.loadnote.over{color:var(--blood)}

/* ---------- task rows ---------- */
.row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid rgba(58,48,85,.7)}
.row:last-child{border-bottom:0}
.tick{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1.5px solid var(--edge);
  background:#1b1530;display:grid;place-items:center;margin-top:1px;font-size:15px;color:transparent;
}
.tick.on{background:var(--verdant);border-color:var(--verdant);color:#12301f}
.rowbody{flex:1;min-width:0}
.rowbody b{font-weight:600;font-size:15px;display:block}
.done .rowbody b{text-decoration:line-through;opacity:.5}
.rowbody small{color:var(--fog);font-size:12.5px}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--edge);color:var(--fog);margin-right:5px}
.pill.farm{color:var(--verdant);border-color:rgba(120,196,151,.4)}
.pill.social{color:#f0a0b4;border-color:rgba(207,74,99,.4)}
.pill.quest{color:var(--candle);border-color:rgba(227,185,92,.4)}
.pill.job{color:#8fc4e0;border-color:rgba(143,196,224,.4)}
.pill.museum{color:var(--iris);border-color:rgba(143,122,224,.45)}
.xbtn{color:var(--fog);font-size:20px;padding:0 4px;line-height:1}

/* ---------- calendar ---------- */
.seasontabs{display:flex;gap:6px;margin-bottom:12px}
.seasontabs button{
  flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--edge);
  font-size:13px;font-weight:600;background:var(--deep);color:var(--fog)
}
.seasontabs button.on{background:var(--panel);color:var(--moon);border-color:var(--iris)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.dow span{text-align:center;font-size:10.5px;color:var(--fog)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{
  aspect-ratio:1/1.18;border-radius:10px;border:1px solid var(--edge);background:var(--deep);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:5px 2px 3px;position:relative;
}
.day .n{font-size:12.5px;font-weight:600;line-height:1}
.day.today{border-color:var(--candle);box-shadow:0 0 0 1px var(--candle) inset}
.day.sel{background:var(--iris);border-color:var(--iris);color:#fff}
.day.past{opacity:.45}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--fog)}
.day .mark{position:absolute;top:2px;right:3px;font-size:9px}
.heat{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:#3a3055;overflow:hidden}
.heat i{display:block;height:100%}

/* ---------- forms ---------- */
label.f{display:block;font-size:12.5px;color:var(--fog);margin:12px 0 5px}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--edge);
  background:#1b1530;color:var(--moon);-webkit-appearance:none;font-size:16px;
}
textarea{min-height:60px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--edge);background:#1b1530;font-size:13px;color:var(--fog)}
.chip.on{background:var(--iris);border-color:var(--iris);color:#fff}
.btn{
  display:block;width:100%;padding:14px;border-radius:12px;background:var(--iris);color:#fff;
  font-weight:700;font-size:15px;text-align:center;margin-top:16px;
}
.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--moon)}
.btn.danger{background:transparent;border:1px solid rgba(207,74,99,.5);color:var(--blood)}
.btn:active{filter:brightness(.9)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

/* ---------- wizard ---------- */
.wiz{position:fixed;inset:0;z-index:95;background:
  radial-gradient(120% 55% at 50% 0%, #2c2348 0%, transparent 60%), var(--ink);
  overflow:auto;-webkit-overflow-scrolling:touch;display:none}
.wiz.on{display:block}
.wizbox{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 20px calc(40px + env(safe-area-inset-bottom))}
.wizdots{display:flex;gap:6px;margin-bottom:22px}
.wizdots i{height:3px;flex:1;border-radius:9px;background:#322a4d}
.wizdots i.on{background:var(--candle)}
.wizsub{color:var(--fog);font-size:13.5px;line-height:1.5;margin:0 0 4px}

/* ---------- sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:80;background:rgba(10,7,18,.6);
  display:none;align-items:flex-end;backdrop-filter:blur(3px);
}
.sheet.on{display:flex}
.sheetbox{
  width:100%;max-height:88vh;overflow:auto;background:var(--deep);
  border-radius:20px 20px 0 0;border-top:1px solid var(--edge);
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.grab{width:38px;height:4px;border-radius:9px;background:var(--edge);margin:8px auto 12px}

/* ---------- villagers ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.vcard{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:9px 6px;text-align:center;position:relative}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  position:relative;overflow:hidden;margin:0 auto 4px;flex:0 0 54px}
.av b{font-size:24px;line-height:1;font-weight:400;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.av.sm{width:36px;height:36px;margin:0;flex:0 0 36px}
.av.sm b{font-size:17px}
.av.lg{width:70px;height:70px;flex:0 0 70px;margin:0}
.av.lg b{font-size:32px}
.vcard img{width:54px;height:54px;object-fit:contain;display:block;margin:0 auto 4px}
.fb{width:54px;height:54px;margin:0 auto 4px;border-radius:50%;background:#2f2750;display:grid;place-items:center;font-size:20px}
.vcard .fb{width:54px;height:54px;margin:0 auto 4px;border-radius:50%;background:#2f2750;display:grid;place-items:center;font-size:20px}
.vcard b{display:block;font-size:12.5px;font-weight:600}
.vcard small{display:block;font-size:10.5px;color:var(--fog)}
.vcard .hb{margin-top:4px;font-size:10px;color:var(--blood)}
.vcard.soon{border-color:var(--candle)}
.vcard .bdaytag{position:absolute;top:-6px;right:-4px;background:var(--candle);color:#2a1f05;font-size:9.5px;font-weight:800;border-radius:99px;padding:2px 6px}

.hearts{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.hearts button{width:26px;height:26px;font-size:17px;line-height:1;color:#4b3f6b}
.hearts button.on{color:var(--blood)}
.step{width:36px;height:36px;border-radius:9px;border:1px solid var(--edge);background:#1b1530;font-size:18px;line-height:1;flex:0 0 36px}
.hval{width:28px;text-align:center;font-weight:700;font-size:15px}

/* ---------- museum ---------- */
.wing{border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;margin-bottom:9px;background:var(--panel)}
.wing > button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left}
.wing h3{margin:0;font-size:15px;flex:1}
.wingbar{width:56px;height:6px;border-radius:99px;background:#3a3055;overflow:hidden;flex:0 0 56px}
.wingbar i{display:block;height:100%;background:var(--verdant)}
.wing .items{display:none;padding:0 14px 8px}
.wing.open .items{display:block}
.pct{font-size:11.5px;color:var(--fog);min-width:34px;text-align:right}

/* ---------- crops ---------- */
.croprow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(58,48,85,.7)}
.croprow:last-child{border-bottom:0}
.croprow .cn{flex:1;min-width:0}
.croprow b{font-size:14.5px;display:block}
.croprow small{color:var(--fog);font-size:12px}
.seasondot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.plantbtn{border:1px solid var(--edge);border-radius:9px;padding:7px 11px;font-size:12.5px;color:var(--verdant)}

.searchwrap{position:relative;margin-bottom:10px}
.empty{text-align:center;color:var(--fog);font-size:13.5px;padding:22px 10px}
.tip{font-size:12.5px;color:var(--fog);background:rgba(143,122,224,.09);border:1px solid rgba(143,122,224,.25);border-radius:10px;padding:10px 12px;margin-top:10px}

/* ---------- tab bar ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(29,23,48,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--edge);display:flex;
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fog);font-size:10.5px}
nav button.on{color:var(--moon)}
nav button span:first-child{font-size:19px;line-height:1}
nav button.on span:first-child{filter:drop-shadow(0 0 7px rgba(227,185,92,.5))}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 22px);
  background:var(--panel);border:1px solid var(--iris);border-radius:99px;padding:10px 18px;
  font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .18s
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
</style>
</head>
<body>

<header class="datebar">
  <button class="moondial" id="dial" aria-label="Change date"><i id="dialday">1</i></button>
  <div class="dateinfo" id="dateinfo"></div>
  <button class="nightbtn" id="nextnight">End night →</button>
</header>

<div id="nosave" style="display:none">
  <b>Progress won't save here.</b>

  <button data-v="farm"><span>🌱</span><span>Farm</span></button>
</nav>

<div class="wiz" id="wiz"></div>
<div class="sheet" id="sheet"><div class="sheetbox" id="sheetbox"></div></div>
<div class="toast" id="toast"></div>

<script>

const KEY="moonlight-almanac-v1";

const abs=(y,s,d)=>(y-1)*YEAR+s*DAYS_PER_SEASON+d;

const fromAbs=n=>{const k=n-1;return{y:Math.floor(k/YEAR)+1,s:Math.floor((k%YEAR)/DAYS_PER_SEASON),d:(k%DAYS_PER_SEASON)+1}};
const wdOf=d=>(d-1)%7;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

let storageMode="unknown", saveTimer=null;
async function probeStorage(){
  if(window.storage&&window.storage.set){
    try{await window.storage.set(KEY+":probe","1");storageMode="cloud";return}catch(e){}
  }
  try{localStorage.setItem(KEY+":probe","1");localStorage.removeItem(KEY+":probe");storageMode="local";return}
  catch(e){}
  storageMode="none";
}
async function writeStore(v){
  if(storageMode==="cloud"){try{await window.storage.set(KEY,v);return true}catch(e){storageMode="unknown"}}
  if(storageMode!=="none"){try{localStorage.setItem(KEY,v);storageMode="local";return true}catch(e){}}
  storageMode="none"; return false;
}
async function readStore(){
  if(window.storage&&window.storage.get){
    try{const r=await window.storage.get(KEY); if(r&&r.value) return r.value}catch(e){}
  }
  try{const v=localStorage.getItem(KEY); if(v) return v}catch(e){}
  return null;
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{
  const ok=await writeStore(JSON.stringify(S));
  const b=document.getElementById("nosave"); if(b) b.style.display=ok?"none":"flex";
},350)}
async function load(){
  await probeStorage();
  try{const raw=await readStore(); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
  let fixed=false;
  (S.tasks||[]).forEach(t=>{ if(t.title&&t.title.indexOf("Lina")>-1){
    t.title=t.title.replace("Lina","Luna"); fixed=true } });

}

/* ============ SETUP ============ */
/* key, label, kind, weight, repeat-kind, on-by-default */
const CHORES=[

function buildState(W){
  const A=(y,s,d)=>(y-1)*YEAR+s*DAYS_PER_SEASON+d;
  const N=A(W.y,W.s,W.d);
  let sat=N; while(wdOf(fromAbs(sat).d)!==5) sat++;      // next Saturday
  const T=(title,kind,w,rep,start)=>({id:uid(),title,kind,w,rep,start,done:{}});

    if(!W.chores.includes(c[0])) return;
    const r=c[4];
    if(r==="day")      tasks.push(T(c[1],c[2],c[3],ev(1),N));

    else if(r==="alt2")tasks.push(T(c[1],c[2],c[3],ev(2),N+1));

    else if(r==="thu") tasks.push(T(c[1],c[2],c[3],wk([3]),N));
    else if(r==="sat2a") tasks.push(T(c[1],c[2],c[3],ev(14),sat));

  });

  Object.keys(W.hearts||{}).forEach(n=>{
    vill[n]={h:W.hearts[n],note:"",talked:{},gifted:{},
      goal:(W.push||[]).includes(n)?"push":(W.hearts[n]>=8?"maintain":"rotate")};
  });

          museum:{}, plots:[], rounds:{}, extra:{}, vill, tasks};

/* ============ SCHEDULE ENGINE ============ */
function taskOn(t,a){
  if(a<t.start) return false;
  const diff=a-t.start;
  if(t.rep.t==="every") return diff%Math.max(1,t.rep.n)===0;
  if(t.rep.t==="week"){const {d}=fromAbs(a);return (t.rep.wd||[]).includes(wdOf(d))}
  return diff===0;
}
function harvestsFor(p){
  const c=CROPS.find(x=>x[0]===p.crop); if(!c) return [];
  const [,seasons,grow,regrow]=c, out=[];
  let a=p.start+grow, guard=0;
  while(guard++<40){
    const f=fromAbs(a);
    if(!seasons.includes(f.s)) break;
    out.push(a);
    if(!regrow) break;
    a+=regrow;
  }
  return out;
}

function lastGift(n){const g=(S.vill[n]||{}).gifted||{};let m=0;for(const k in g){if(+k>m)m=+k}return m}
function tierOf(v){
  const st=S.vill[v[0]]||{}, h=st.h||0, goal=st.goal||"rotate";
  if(goal==="skip") return null;
  if(goal==="push") return h>=8?30:100;
  if(h<4 && (v[4]==="romance"||v[4]==="friend")) return 70;
  if(h<8) return 50;
  return 30;
}
function roundsFor(a){
  S.rounds=S.rounds||{};
  if(S.rounds[a]) return S.rounds[a];
  const salt=a+(S.roundsShift||0)*97;
  const jit=n=>{let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))|0;
    return Math.abs((h^(salt*2654435761))|0)%7};
  const scored=[];
  VILLAGERS.forEach(v=>{const t=tierOf(v); if(t===null)return;
    const lg=lastGift(v[0]), since=lg?Math.min(14,a-lg):14;
    const pull=(t===30?5:2);   // long-neglected partners climb back up fast
    scored.push({n:v[0],tier:t,s:t+since*pull+jit(v[0])});});
  scored.sort((x,y)=>y.s-x.s);
  const n=Math.max(1,S.roundsN||4), pick=[];
  const other=scored.find(x=>x.tier<100);
  if(other&&n>1) pick.push(other.n);                 // always one person you're still building from scratch
  for(const x of scored){ if(pick.length>=n) break; if(!pick.includes(x.n)) pick.push(x.n) }
  S.rounds[a]=pick; save(); return pick;
}
function giftHint(name){
  const v=VILLAGERS.find(x=>x[0]===name); if(!v) return "";
  const st=S.vill[name]||{}, h=st.h||0;

  return h+" hearts"+(loved?" · loves "+loved:" · tastes unknown, try their colour");
}

  return c.length?c[0][0]:null;
}

  S.plots.forEach(p=>{ if(harvestsFor(p).includes(a))
    items.push({k:"farm",t:"Harvest "+p.crop,n:p.qty>1?p.qty+" plots":"",w:1,auto:"harv:"+p.id+":"+a}) });

  if(a===today()) roundsFor(a).forEach(n=>
    items.push({k:"social",t:"Gift "+n,n:giftHint(n),w:1,gift:n}));
  else if(S.rounds&&S.rounds[a]) S.rounds[a].forEach(n=>
    items.push({k:"social",t:"Gift "+n,n:giftHint(n),w:1,gift:n}));
  else items.push({k:"social",t:"Gift rounds",n:(S.roundsN||4)+" visits, picked on the night",
    w:S.roundsN||4,auto:"rounds:"+a});
  return items;
}
function repLabel(t){
  if(t.rep.t==="every") return "Every "+t.rep.n+" night"+(t.rep.n>1?"s":"");
  if(t.rep.t==="week") return (t.rep.wd||[]).map(i=>DOW[i]).join(", ");
  return "";
}
const loadOf=a=>agenda(a).reduce((n,i)=>n+i.w,0);
function isDone(it,a){
  if(it.gift){const st=S.vill[it.gift]; return !!(st&&st.gifted&&st.gifted[a])}
  if(it.auto) return !!S.museum["_auto:"+it.auto];
  const t=S.tasks.find(x=>x.id===it.id); return !!(t&&t.done&&t.done[a]);
}
function toggleDone(it,a){
  if(it.gift){const st=S.vill[it.gift]||(S.vill[it.gift]={h:0,note:"",talked:{},gifted:{}});
    st.gifted=st.gifted||{}; st.gifted[a]?delete st.gifted[a]:st.gifted[a]=1;
    save();render();return}
  if(it.auto){const k="_auto:"+it.auto; if(S.museum[k]) delete S.museum[k]; else S.museum[k]=1;}
  else{const t=S.tasks.find(x=>x.id===it.id); if(!t)return; t.done=t.done||{};
    if(t.done[a]) delete t.done[a]; else t.done[a]=1;}
  save(); render();
}

/* ============ SHARED BITS ============ */
function dateLine(){
  const{y,s,d}=S.date;
  return `${SEASON_ICON[SEASONS[s]]} ${SEASONS[s]} ${d} · ${DOW[wdOf(d)]} · Year ${y}`;
}
function loadBar(a){
  const items=agenda(a), total=items.reduce((n,i)=>n+i.w,0), cap=S.cap;
  const pct=Math.min(100,Math.round(total/cap*100));
  const col=total>cap?"var(--blood)":total===cap?"var(--candle)":"var(--verdant)";
  const cls=total>cap?"over":total>=cap?"warn":"";
  const msg=total===0?"Nothing booked. A quiet night.":
    total>cap?`Overloaded — ${total} of ${cap} points booked. Move something.`:
    total>=cap?`Full night — ${total} of ${cap} points.`:
    `${total} of ${cap} points booked. Room for more.`;
  return `<div class="loadbar"><i style="width:${pct}%;background:${col}"></i></div>
          <div class="loadnote ${cls}">${msg}</div>`;
}
function rowHTML(it,a){
  const done=isDone(it,a);
  return `<div class="row ${done?"done":""}">
    <button class="tick ${done?"on":""}" data-tick="${esc(JSON.stringify(it))}" data-abs="${a}" aria-label="Mark done">✓</button>

}

function heartPanel(){

function nextBirthdays(n){
  const a=today(), out=[];
  VILLAGERS.filter(v=>v[2]>=0).forEach(v=>{
    for(let y=S.date.y;y<=S.date.y+1;y++){
      const t=abs(y,v[2],v[3]);
      if(t>=a){out.push({name:v[0],s:v[2],d:v[3],away:t-a,loved:(v[5]||[])[0]});break}
    }
  });
  return out.sort((x,y)=>x.away-y.away).slice(0,n);
}

function vFarm(){
  const a=today();
  const growing=S.plots.map(p=>{
    const hs=harvestsFor(p), next=hs.find(h=>h>=a);
    return{p,next,left:next?next-a:null,total:hs.length,remaining:hs.filter(h=>h>=a).length}
  }).sort((x,y)=>(x.left??999)-(y.left??999));
  const pool=[...CROPS.map(c=>({n:c[0],ss:c[1],g:c[2],r:c[3],y:c[4],sell:c[5],seed:c[6],k:c[7]})),
    ...HERBS.map(h=>({n:h[0],ss:h[1],g:0,r:0,y:0,sell:h[2],seed:h[3],k:"herb"})),
    ...MUSHROOMS.map(m=>({n:m[0],ss:m[1],g:0,r:0,y:0,sell:0,seed:0,k:"mushroom"}))];
  const shown=pool.filter(c=>{
    if(farmQ && !c.n.toLowerCase().includes(farmQ.toLowerCase())) return false;
    if(farmFilter==="now") return c.ss.includes(S.date.s);
    if(farmFilter==="all") return true;
    return c.ss.includes(+farmFilter);
  }).sort((x,y)=>(x.g||99)-(y.g||99)||x.n.localeCompare(y.n));
  const left=DAYS_PER_SEASON-S.date.d;
  return `
  ${growing.length?`<section>
    <div class="sechead"><h2>In the ground</h2><span class="meta">${growing.length} planting${growing.length>1?"s":""}</span></div>
    <div class="card">${growing.map(g=>`<div class="row" style="align-items:center">
      <div class="rowbody"><b>${esc(g.p.crop)}${g.p.qty>1?" ×"+g.p.qty:""}</b>
      <small>${g.left===null?"season's over — pull it up":g.left===0?"ready tonight":"ready in "+g.left+" night"+(g.left>1?"s":"")}${g.remaining>1?" · "+g.remaining+" harvests left":""}</small></div>
      <button class="xbtn" data-plotdel="${g.p.id}">×</button></div>`).join("")}</div>
  </section>`:""}
  <section>
    <div class="sechead"><h2>Seeds</h2><span class="meta">${left} night${left===1?"":"s"} left in ${SEASONS[S.date.s]}</span></div>
    <div class="searchwrap"><input type="text" id="cropq" placeholder="Search seeds" value="${esc(farmQ)}"></div>
    <div class="chips" style="margin-bottom:10px">
      <button class="chip ${farmFilter==="now"?"on":""}" data-ff="now">In season now</button>
      ${SEASONS.map((s,i)=>`<button class="chip ${farmFilter===String(i)?"on":""}" data-ff="${i}">${s}</button>`).join("")}
      <button class="chip ${farmFilter==="all"?"on":""}" data-ff="all">All</button>
    </div>
    <div class="card">${shown.length?shown.map(c=>{
      const nextS=(S.date.s+1)%4;
      const fits=!c.g||c.g<=left||c.ss.includes(nextS);
      return `<div class="croprow">
        <div class="cn"><b>${esc(c.n)}</b>
          <small>${c.ss.map(i=>`<span class="seasondot" style="background:${SEASON_COL[SEASONS[i]]}"></span>`).join("")}
          ${c.g?c.g+"d":"instant"}${c.r?" · regrows "+c.r+"d":""}${c.sell?" · "+c.sell+"g":""}${c.seed?" · seed "+c.seed+"g":""}
          ${NOTES[c.n]?"<br>"+esc(NOTES[c.n]):""}
          ${c.g&&!fits?'<br><span style="color:var(--blood)">won&rsquo;t finish this season</span>':""}</small></div>
        <button class="plantbtn" data-plant="${esc(c.n)}">Plant</button>
      </div>`}).join(""):`<div class="empty">No seeds match that.</div>`}</div>
  </section>`;
}

function bindTaskSheet(s,d){
  let kind="farm",w=1,rep="none",n=3,wd=[];
  const opt=()=>{const el=document.getElementById("t-repopt");
    if(rep==="every") el.innerHTML=`<label class="f">Every how many nights?</label><input type="number" id="t-n" min="1" max="28" value="${n}">`;
    else if(rep==="week") el.innerHTML=`<label class="f">Which nights?</label><div class="chips" id="t-wd">${DOW.map((x,i)=>`<button class="chip ${wd.includes(i)?"on":""}" data-wd="${i}">${x}</button>`).join("")}</div>`;
    else el.innerHTML="";
  };
  opt();
  sheetbox.addEventListener("click",e=>{
    const k=e.target.closest("[data-k]"),ww=e.target.closest("[data-w]"),r=e.target.closest("[data-r]"),d2=e.target.closest("[data-wd]");
    if(k){kind=k.dataset.k;k.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===k))}
    if(ww){w=+ww.dataset.w;ww.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===ww))}
    if(r){rep=r.dataset.r;r.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===r));opt()}
    if(d2){const i=+d2.dataset.wd; wd.includes(i)?wd=wd.filter(x=>x!==i):wd.push(i); d2.classList.toggle("on")}
    if(e.target.id==="t-save"){
      const title=document.getElementById("t-title").value.trim();
      if(!title){toast("Give it a name first");return}
      const nn=document.getElementById("t-n"); if(nn) n=Math.max(1,+nn.value||1);
      if(rep==="week"&&!wd.length){toast("Pick at least one night");return}
      S.tasks.push({id:uid(),title,kind,w,rep:{t:rep,n,wd:wd.slice()},start:abs(S.date.y,s,d),done:{}});
      save();closeSheet();render();toast("Scheduled");
    }
  });

function resolveName(q){
  const n=q.trim().toLowerCase().replace(/[.']/g,"");
  if(!n) return null;
  const names=VILLAGERS.map(v=>v[0]);
  const norm=x=>x.toLowerCase().replace(/[.']/g,"");
  let hit=names.filter(x=>norm(x)===n);
  if(!hit.length) hit=names.filter(x=>norm(x).startsWith(n));
  if(!hit.length) hit=names.filter(x=>norm(x).includes(n));
  return hit.length===1?hit[0]:null;
}
function applyHearts(text){
  const done=[], miss=[];
  text.split(/[,;\n]+/).forEach(chunk=>{
    const m=chunk.trim().match(/^(.*?)[\s:=-]*(\d{1,2})$/);
    if(!m||!m[1].trim()) return;
    const name=resolveName(m[1]), h=Math.max(0,Math.min(10,+m[2]));
    if(!name){miss.push(chunk.trim());return}
    const st=S.vill[name]||(S.vill[name]={h:0,note:"",talked:{},gifted:{},goal:"rotate"});
    st.h=h; done.push(name+" "+h);
  });
  if(done.length){ if(S.rounds) delete S.rounds[today()]; save() }
  return {done,miss};
}

/* ============ ACTIONS ============ */
function copy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
}
function copyTonight(){
  const a=today(), items=agenda(a);
  if(!items.length){toast("Nothing to copy");return}
  copy(`${SEASONS[S.date.s]} ${S.date.d} (${DOW[wdOf(S.date.d)]})\n`+items.map(i=>"• "+i.t).join("\n"));
  toast("Copied — paste it into Reminders");
}
function balanceWeek(){
  const a=today(); let moved=0;
  for(let i=0;i<7;i++){
    const day=a+i; let l=loadOf(day);
    while(l>S.cap){
      const movable=S.tasks.filter(t=>t.rep.t==="none"&&t.start===day&&!(t.done&&t.done[day]))
        .sort((x,y)=>(y.w||1)-(x.w||1));
      if(!movable.length) break;
      let best=null,bestL=99;
      for(let j=0;j<7;j++){const cand=a+j; if(cand===day)continue;
        const cl=loadOf(cand); if(cl<bestL){bestL=cl;best=cand}}
      if(best===null||bestL+(movable[0].w||1)>S.cap) break;
      movable[0].start=best; moved++; l=loadOf(day);
    }
  }
  save();render();
  toast(moved?`Moved ${moved} task${moved>1?"s":""} to lighter nights`:"Already spread out nicely");
}
function birthdayReminder(name){
  const v=VILLAGERS.find(x=>x[0]===name); if(!v||v[2]<0)return;
  const bd=abs(S.date.y,v[2],v[3]);
  const start=(bd-1>=today())?bd-1:abs(S.date.y+1,v[2],v[3])-1;
  const loved=(v[5]||[])[0];
  S.tasks.push({id:uid(),title:"Wrap a gift for "+name,kind:"social",w:1,
    rep:{t:"every",n:YEAR,wd:[]},start,done:{},
    });
  save();render();
  toast(loved?`Reminder set — ${name} loves ${loved}`:"Reminder set the night before");
}

  fixImgs(el); fixImgs(sheetbox);
}
function fixImgs(root){
  if(!root) return;
  root.querySelectorAll("img[data-fb]").forEach(img=>{
    img.onerror=()=>img.remove();
    if(img.complete&&img.naturalWidth===0) img.remove();
  });
}
function dailyHint(){
  const a=today(), items=agenda(a), l=items.reduce((n,i)=>n+i.w,0);
  const bd=VILLAGERS.find(v=>v[2]===S.date.s&&v[3]===S.date.d);
  if(bd) return bd[0]+"'s birthday";
  const f=FESTIVALS.find(x=>x[0]===S.date.s&&x[1]===S.date.d);
  if(f) return f[2];
  return l?l+" points booked":"nothing booked";
}

document.getElementById("wiz").addEventListener("click",wizClick);
document.addEventListener("click",e=>{
  if(e.target.closest("#wiz")) return;
  const t=e.target;
  const nav=t.closest("nav button");
  if(nav){view=nav.dataset.v; if(view==="plan")planSeason=S.date.s; render(); window.scrollTo(0,0); return}
  if(t.closest("#dial")) return sheetSettings();
  if(t.closest("#nextnight")){
    S.date.d++; if(S.date.d>28){S.date.d=1;S.date.s++; if(S.date.s>3){S.date.s=0;S.date.y++}}
    planSeason=S.date.s; save();render();
    const l=loadOf(today());
    toast(l?`${SEASONS[S.date.s]} ${S.date.d} — ${l} points ahead`:`${SEASONS[S.date.s]} ${S.date.d} — clear night`);
    window.scrollTo(0,0); return;
  }
  const tick=t.closest("[data-tick]");
  if(tick){toggleDone(JSON.parse(tick.dataset.tick),+tick.dataset.abs); if(sheet.classList.contains("on"))closeSheet(); return}
  const del=t.closest("[data-del]");
  if(del){S.tasks=S.tasks.filter(x=>x.id!==del.dataset.del);save();render();closeSheet();toast("Removed");return}
  const pd=t.closest("[data-plotdel]");
  if(pd){S.plots=S.plots.filter(x=>x.id!==pd.dataset.plotdel);save();render();toast("Cleared the plot");return}
  const day=t.closest("[data-day]");
  if(day){planSel=+day.dataset.day;render();sheetDay(planSel);return}
  const se=t.closest("[data-season]");
  if(se){planSeason=+se.dataset.season;render();return}
  const ts=t.closest("[data-ts]");
  if(ts){townSort=ts.dataset.ts;render();return}
  const v=t.closest("[data-vill]");
  if(v){sheetVill(v.dataset.vill);return}
  const wt=t.closest("[data-wtog]");
  if(wt){wt.parentNode.classList.toggle("open");return}
  const am=t.closest("[data-addmus]");
  if(am){const n=prompt("What's the piece called?"); if(n&&n.trim()){
    S.extra=S.extra||{}; (S.extra[am.dataset.addmus]=S.extra[am.dataset.addmus]||[]).push([n.trim(),"added by you"]);
    save();render();} return}
  const mu=t.closest("[data-mus]");
  if(mu){const n=mu.dataset.mus; S.museum[n]?delete S.museum[n]:S.museum[n]=1; save();
    mu.classList.toggle("on");
    const w=mu.closest(".wing"); if(w){const open=w.classList.contains("open");render();
      const w2=document.querySelector('[data-wing="'+w.dataset.wing+'"]'); if(w2&&open)w2.classList.add("open");}
    return}
  const pl=t.closest("[data-plant]");
  if(pl){sheetPlant(pl.dataset.plant);return}
  const ff=t.closest("[data-ff]");
  if(ff){farmFilter=ff.dataset.ff;render();return}
  const br=t.closest("[data-bremind]");
  if(br){birthdayReminder(br.dataset.bremind);closeSheet();return}
  if(t.id==="quickadd"||t.id==="addtask") return sheetTask(view==="plan"?(planSel||S.date.d):null);
  if(t.id==="nosave-backup"){copy(JSON.stringify(S));toast("Backup copied — paste it somewhere safe");return}
  if(t.id==="edithearts") return sheetHearts();
  if(t.id==="copytonight") return copyTonight();
  if(t.id==="balance"||t.id==="balance2") return balanceWeek();
});
document.addEventListener("input",e=>{
  if(e.target.id==="cropq"){farmQ=e.target.value;const p=e.target.selectionStart;render();
    const n=document.getElementById("cropq"); if(n){n.focus();n.setSelectionRange(p,p)}}
});

(async function(){
  await load();
  planSeason=S.date.s;
  render();
  if(!S.seen) startWizard(false);
  if(storageMode==="none"){
    const b=document.getElementById("nosave"); if(b) b.style.display="flex";
  }
})();
</script>
</body>
